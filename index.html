<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEF-88</title>
  <style>
    :root {
      --bg-oscuro: #121a22;
      --panel-bg: #1c2733;
      --acento-naranja: #ff6b35;
      --texto-ligero: #e0e6ed;
      --texto-silenciado: #8a99ad;
      --color-borde: #2e3d4e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-oscuro);
      color: var(--texto-ligero);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-borde);
    }

    header h1 { color: var(--acento-naranja); font-size: 1.2rem; font-weight: bold; }

    .btn-api {
      background: transparent;
      border: 1px solid var(--color-borde);
      color: var(--texto-silenciado);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .bot-message {
      background-color: var(--panel-bg);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid var(--color-borde);
    }

    .user-message {
      background-color: var(--acento-naranja);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    #input-container {
      padding: 12px 16px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--color-borde);
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-oscuro);
      border: 1px solid var(--color-borde);
      color: var(--texto-ligero);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    button.btn-send {
      background-color: var(--acento-naranja);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content h3 { color: var(--acento-naranja); }
    .modal-content input { width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>CHEF-88</h1>
    <button class="btn-api" onclick="openModal()">Clave API</button>
  </header>

  <div id="chat-container">
    <div class="message bot-message">Soy CHEF-88, tu asistente culinario. Dime qué quieres cocinar o qué ingredientes tienes. Si te falta algo de calidad gourmet, te prepararé la lista para pedírtelo a casa.</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Escribe un mensaje..." onkeypress="handleKey(event)">
    <button class="btn-send" onclick="sendMessage()">Enviar</button>
  </div>

  <div id="api-modal" class="modal">
    <div class="modal-content">
      <h3>Configurar Clave API</h3>
      <p style="font-size:0.85rem; color: var(--texto-silenciado);">Ingresa tu API Key de Google AI Studio:</p>
      <input type="text" id="api-key-input" placeholder="Pega tu clave aquí...">
      <div class="modal-actions">
        <button class="btn-api" onclick="closeModal()">Cancelar</button>
        <button class="btn-send" style="padding: 8px 16px;" onclick="saveApiKey()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('CHEF88_API_KEY') || '';

    window.onload = () => {
      if (!apiKey) openModal();
    };

    function openModal() {
      document.getElementById('api-key-input').value = apiKey;
      document.getElementById('api-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('api-modal').style.display = 'none';
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        apiKey = key;
        localStorage.setItem('CHEF88_API_KEY', key);
        closeModal();
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert('Por favor, ingresa tu Clave API primero.');
        openModal();
        return;
      }

      appendMessage(text, 'user-message');
      input.value = '';

      const loadingId = appendMessage('CHEF-88 está pensando...', 'bot-message');
      const loadingElem = document.getElementById(loadingId);

      // Lista de modelos a probar automáticamente
      const models = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-2.0-flash-exp'];
      let success = false;

      for (const model of models) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: "Eres CHEF-88, un chef experto, sarcástico pero servicial. " + text }]
              }]
            })
          });

          const data = await response.json();

          if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            loadingElem.innerText = data.candidates[0].content.parts[0].text;
            success = true;
            break;
          }
        } catch (e) {
          // Si falla un modelo, pasa al siguiente de la lista
        }
      }

      if (!success) {
        loadingElem.innerText = 'Error al conectar con los modelos de Gemini. Verifica tu clave API.';
      }
    }

    function appendMessage(text, className) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${className}`;
      msg.id = 'msg-' + Date.now();
      msg.innerText = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg.id;
    }
  </script>
</body>
</html>
