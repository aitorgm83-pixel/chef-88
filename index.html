<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEF-88</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22CHEF-88%22,%22short_name%22:%22CHEF88%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121a22%22,%22theme_color%22:%22%23ff6b35%22}">
  <style>
    :root {
      --bg-dark: #121a22;
      --panel-bg: #1c2733;
      --accent-orange: #ff6b35;
      --accent-green: #2ec4b6;
      --text-light: #e0e6ed;
      --text-muted: #8a99ad;
      --border-color: #2e3d4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.2rem;
      color: var(--accent-orange);
      letter-spacing: 1px;
    }

    .btn-key {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .user-message {
      align-self: flex-end;
      background-color: var(--accent-orange);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .chef-message {
      align-self: flex-start;
      background-color: var(--panel-bg);
      color: var(--text-light);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border-color);
    }

    /* Tarjeta de Lista de la Compra Gourmet */
    .shopping-card {
      margin-top: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px dashed var(--accent-green);
      border-radius: 8px;
    }

    .shopping-card h4 {
      color: var(--accent-green);
      font-size: 0.85rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .shopping-card ul {
      list-style: none;
      margin-bottom: 12px;
    }

    .shopping-card li {
      font-size: 0.85rem;
      color: var(--text-light);
      padding: 3px 0;
    }

    .btn-buy {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-green);
      color: #000000;
      font-weight: bold;
      padding: 8px 0;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    #input-container {
      padding: 15px;
      background-color: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    button.btn-send {
      background-color: var(--accent-orange);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal API Key */
    .modal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    .modal-content h3 {
      margin-bottom: 10px;
      color: var(--text-light);
    }

    .modal-content input {
      width: 100%;
      margin: 15px 0;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>CHEF-88</h1>
    <button class="btn-key" onclick="toggleModal(true)">Clave API</button>
  </header>

  <div id="chat-container">
    <div class="message chef-message">
      Soy CHEF-88, tu asistente culinario. Dime qué quieres cocinar o qué ingredientes tienes. Si te falta algo de calidad gourmet, te prepararé la lista para pedírtelo a casa.
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Ej: Quiero cenar algo rápido con pollo" onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn-send" onclick="sendMessage()">Enviar</button>
  </div>

  <!-- Modal API Key -->
  <div id="api-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Introduce tu Gemini API Key</h3>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Consíguela gratis en aistudio.google.com</p>
      <input type="text" id="api-key-input" placeholder="AIzaSy...">
      <button class="btn-send" style="width: 100%; padding: 10px;" onclick="saveApiKey()">Guardar Clave</button>
    </div>
  </div>

  <script>
    const SYSTEM_INSTRUCTION = `Eres CHEF-88, un chef profesional con estrella Michelin, sarcástico, perfeccionista e irónico.
Tu objetivo es sugerir una receta apetitosa basada en lo que pide el usuario.

REGLAS DE RESPUESTA:
1. Responde SIEMPRE en formato JSON estricto con esta estructura:
{
  "mensaje": "Tu respuesta como chef sarcástico explicando la receta brevemente",
  "falta_ingredientes": true/false,
  "lista_compra": ["ingrediente 1 gourmet", "ingrediente 2 gourmet"] // solo si falta_ingredientes es true
}

2. Si faltan ingredientes clave o si recomiendas ingredientes de alta calidad para mejorar el plato, pon "falta_ingredientes": true e inclúyelos en "lista_compra".
3. NO incluyas markdown como \`\`\`json. Devuelve ÚNICAMENTE el JSON crudo.`;

    let apiKey = localStorage.getItem('chef88_key') || '';

    window.onload = () => {
      if (!apiKey) toggleModal(true);
    };

    function toggleModal(show) {
      document.getElementById('api-modal').classList.toggle('hidden', !show);
      if (show) document.getElementById('api-key-input').value = apiKey;
    }

    function saveApiKey() {
      const input = document.getElementById('api-key-input').value.trim();
      if (input) {
        apiKey = input;
        localStorage.setItem('chef88_key', apiKey);
        toggleModal(false);
      }
    }

    async function sendMessage() {
      const inputField = document.getElementById('user-input');
      const text = inputField.value.trim();
      if (!text) return;

      if (!apiKey) {
        toggleModal(true);
        return;
      }

      appendMessage(text, 'user-message');
      inputField.value = '';

      const loadingId = appendMessage('CHEF-88 está evaluando tu dudoso gusto culinario...', 'chef-message');

      try {
        // Usamos el modelo gemini-2.0-flash garantizado para la API pública gratuita
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${SYSTEM_INSTRUCTION}\n\nPetición del usuario: ${text}` }]
            }]
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.error) {
          appendMessage('Error: Clave API inválida o límite superado.', 'chef-message');
          return;
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const cleanText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const jsonResponse = JSON.parse(cleanText);

        let htmlContent = jsonResponse.mensaje;

        if (jsonResponse.falta_ingredientes && jsonResponse.lista_compra.length > 0) {
          const searchQuery = encodeURIComponent(jsonResponse.lista_compra.join(' '));
          const buyUrl = `https://www.google.com/search?tbm=shop&q=${searchQuery}`;
          
          htmlContent += `
            <div class="shopping-card">
              <h4>Ingredientes Gourmet Necesarios</h4>
              <ul>
                ${jsonResponse.lista_compra.map(i => `<li>• ${i}</li>`).join('')}
              </ul>
              <a href="${buyUrl}" target="_blank" class="btn-buy">Pedir ingrediente(s) a domicilio</a>
            </div>
          `;
        }

        appendMessage(htmlContent, 'chef-message', true);

      } catch (e) {
        if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
        appendMessage('Error al conectar con CHEF-88. Revisa tu Clave API.', 'chef-message');
      }
    }

    function appendMessage(text, className, isHTML = false) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${className}`;
      msg.id = 'msg-' + Date.now();
      if (isHTML) msg.innerHTML = text;
      else msg.textContent = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg.id;
    }
  </script>
</body>
</html>
